<div class="layout-menu-wrapper" [class.layout-menu-dark]="app.darkMenu" (click)="appMain.onMenuClick($event)">
    <div class="layout-menu-container">

        <!-- Sidebar brand header -->
        <div class="sidebar-brand">
            <i class="pi pi-heart sidebar-brand-icon"></i>
            <div class="sidebar-brand-text">
                <span class="sidebar-brand-name">PuyPuy PetMart</span>
                <span class="sidebar-brand-sub">POS System</span>
            </div>
        </div>

        <ul class="layout-menu">
            <li app-menuitem *ngFor="let item of model; let i = index;"
                [item]="item" [index]="i" [root]="true"></li>
        </ul>
    </div>
</div>
