<div class="pt-page">

    <!-- ===== LIST CARD ===== -->
    <div class="pt-list-card">
        <div class="pt-list-header">
            <div class="pt-list-title">
                <i class="pi pi-th-large"></i>
                <span>รายการประเภทสินค้า</span>
            </div>
            <div class="pt-list-actions">
                <div class="p-inputgroup search-box">
                    <span class="p-inputgroup-addon"><i class="pi pi-search"></i></span>
                    <input pInputText type="text" [formControl]="search" placeholder="ค้นหาชื่อประเภท..." />
                    <button *ngIf="search.value" pButton type="button" icon="pi pi-times"
                        class="p-button-danger" (click)="search.reset()"></button>
                </div>
                <button *ngIf="permissions?.manag_product_type" (click)="openAdd()" pButton type="button"
                    icon="pi pi-plus" label="เพิ่มประเภทสินค้า" class="p-button-success"></button>
            </div>
        </div>

        <p-table #dt [value]="data" [lazy]="true" (onLazyLoad)="loadTable($event)" dataKey="id"
            [paginator]="true" [loading]="loading" [rows]="10" [totalRecords]="totalRecords"
            styleClass="p-datatable-gridlines" [rowsPerPageOptions]="[10, 25, 50]">

            <ng-template pTemplate="header">
                <tr>
                    <th style="width:56px; text-align:center;">#</th>
                    <th style="width:90px; text-align:center;">รูปภาพ</th>
                    <th>ชื่อประเภทสินค้า</th>
                    <th style="width:150px; text-align:center;">จัดการ</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
                <tr>
                    <td class="text-center text-muted">{{ rowIndex + 1 }}</td>
                    <td class="text-center">
                        <img class="type-thumb" [src]="item.image || 'assets/images/product.png'" alt="" />
                    </td>
                    <td>
                        <span class="type-name">{{ item.name }}</span>
                    </td>
                    <td class="text-center">
                        <div class="action-btns">
                            <button *ngIf="permissions?.view_product_brand" pButton type="button" icon="pi pi-tags"
                                class="p-button-text p-button-sm p-button-info" pTooltip="รายการแบรนด์สินค้า"
                                [routerLink]="['/app/product_brand']" [queryParams]="{product_type_id: item.id}"></button>
                            <button *ngIf="permissions?.manag_product_type" pButton type="button" icon="pi pi-file-edit"
                                class="p-button-text p-button-sm p-button-secondary"
                                pTooltip="แก้ไข" (click)="openEdit(item.id)"></button>
                            <button *ngIf="permissions?.manag_product_type" pButton type="button" icon="pi pi-trash"
                                class="p-button-text p-button-sm p-button-danger"
                                pTooltip="ลบ" (click)="openDelete(item.id)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td [attr.colspan]="4" class="text-center" style="padding:2.5rem; color:#94a3b8;">
                        <i class="pi pi-th-large" style="font-size:1.5rem; display:block; margin-bottom:.5rem;"></i>
                        ยังไม่มีข้อมูลประเภทสินค้า
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-toast position="bottom-center"></p-toast>

<!-- ===== DIALOG: เพิ่มประเภทสินค้า ===== -->
<p-dialog header="เพิ่มประเภทสินค้า" [(visible)]="displayAdd" [modal]="true" showEffect="fade"
    [style]="{width:'440px'}" [breakpoints]="{'640px':'95vw'}">
    <form [formGroup]="formAdd">
        <div class="dialog-form">
            <div class="uploader-wrap">
                <div class="image-uploader" (click)="fileinputadd.click()">
                    <img class="upload-preview"
                        [src]="formAdd.get('upload_image_status')!.value ? formAdd.get('image')!.value : 'assets/images/product.png'" />
                    <div class="upload-overlay"><i class="pi pi-camera"></i></div>
                    <input #fileinputadd type="file" (change)="onSelectImageProfile($event)" accept="image/*" hidden />
                </div>
                <span class="upload-hint">คลิกเพื่ออัปโหลดรูป</span>
            </div>
            <div class="field">
                <label>ชื่อประเภทสินค้า <span class="required">*</span></label>
                <input pInputText type="text" formControlName="name" maxlength="200"
                    class="w-full" placeholder="เช่น อาหารสุนัข, ของเล่น" />
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton type="button" icon="pi pi-check" (click)="addConfirm()" label="บันทึก"
            class="p-button-success mr-2"></button>
        <button pButton type="button" icon="pi pi-times" (click)="addCancel()" label="ยกเลิก"
            class="p-button-outlined p-button-danger"></button>
    </ng-template>
</p-dialog>

<!-- ===== DIALOG: แก้ไขประเภทสินค้า ===== -->
<p-dialog header="แก้ไขประเภทสินค้า" [(visible)]="displayEdit" [modal]="true" showEffect="fade"
    [style]="{width:'440px'}" [breakpoints]="{'640px':'95vw'}">
    <form [formGroup]="formEdit">
        <div class="dialog-form">
            <div class="uploader-wrap">
                <div class="image-uploader" (click)="fileinputedit.click()">
                    <img class="upload-preview"
                        [src]="formEdit.get('image')!.value || 'assets/images/product.png'" />
                    <div class="upload-overlay"><i class="pi pi-camera"></i></div>
                    <input #fileinputedit type="file" (change)="onSelectImageProfileEdit($event)" accept="image/*" hidden />
                </div>
                <span class="upload-hint">คลิกเพื่อเปลี่ยนรูป</span>
            </div>
            <div class="field">
                <label>ชื่อประเภทสินค้า <span class="required">*</span></label>
                <input pInputText type="text" formControlName="name" maxlength="200" class="w-full" />
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton type="button" icon="pi pi-check" (click)="confirmEdit()" label="บันทึก"
            class="p-button-success mr-2"></button>
        <button pButton type="button" icon="pi pi-times" (click)="cancelEdit()" label="ยกเลิก"
            class="p-button-outlined p-button-danger"></button>
    </ng-template>
</p-dialog>

<!-- ===== DIALOG: ลบ ===== -->
<p-dialog [(visible)]="displayDelete" [modal]="true" showEffect="fade"
    [style]="{width:'360px'}" [breakpoints]="{'640px':'95vw'}" [showHeader]="false">
    <div class="delete-confirm">
        <div class="delete-icon"><i class="pi pi-exclamation-triangle"></i></div>
        <div class="delete-title">ยืนยันการลบ</div>
        <div class="delete-msg">ต้องการลบประเภทสินค้านี้ใช่หรือไม่?<br>การกระทำนี้ไม่สามารถย้อนกลับได้</div>
        <div class="delete-actions">
            <button pButton type="button" icon="pi pi-trash" label="ลบ"
                class="p-button-danger" (click)="confirmDelete()"></button>
            <button pButton type="button" icon="pi pi-times" label="ยกเลิก"
                class="p-button-outlined p-button-secondary" (click)="cancelDelete()"></button>
        </div>
    </div>
</p-dialog>
