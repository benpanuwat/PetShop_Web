<div class="topbar">
    <div class="topbar-wrapper">

        <!-- ── LEFT: hamburger + brand ── -->
        <div class="topbar-left">
            <button class="menu-toggle-btn" (click)="appMain.onMenuButtonClick($event)" type="button"
                aria-label="Toggle menu">
                <i class="pi pi-bars"></i>
            </button>
            <a class="brand-link" href="javascript:void(0);">
                <i class="pi pi-heart brand-icon"></i>
                <span class="brand-name">PuyPuy PetMart</span>
            </a>
        </div>

        <!-- ── RIGHT: branch + user ── -->
        <div class="topbar-right">
            <!-- Branch chip: คลิกได้ถ้ามีหลายสาขา -->
            <ng-container *ngIf="branch_name">
                <button *ngIf="userBranches.length > 1; else staticChip"
                    class="branch-chip branch-chip-btn"
                    [class.switching]="switchingBranch"
                    type="button"
                    (click)="branchPanel.toggle($event)"
                    [disabled]="switchingBranch">
                    <i class="pi pi-building"></i>
                    <span>{{ branch_name }}</span>
                    <i class="pi pi-angle-down branch-caret" *ngIf="!switchingBranch"></i>
                    <i class="pi pi-spin pi-spinner branch-caret" *ngIf="switchingBranch"></i>
                </button>
                <ng-template #staticChip>
                    <div class="branch-chip">
                        <i class="pi pi-building"></i>
                        <span>{{ branch_name }}</span>
                    </div>
                </ng-template>
            </ng-container>

            <p-overlayPanel #branchPanel styleClass="branch-overlay-panel"
                [showTransitionOptions]="'150ms'" [hideTransitionOptions]="'100ms'">
                <ng-template pTemplate>
                    <div class="branch-panel-title">เลือกสาขา</div>
                    <div class="branch-panel-list">
                        <button *ngFor="let b of userBranches"
                            class="branch-panel-item"
                            [class.active]="b.name === branch_name"
                            type="button"
                            (click)="selectBranch(b, branchPanel)">
                            <i class="pi pi-building"></i>
                            <span>{{ b.name }}</span>
                            <i class="pi pi-check branch-check" *ngIf="b.name === branch_name"></i>
                        </button>
                    </div>
                </ng-template>
            </p-overlayPanel>

            <button class="user-trigger" type="button" (click)="userPanel.toggle($event)">
                <img class="user-avatar"
                    [src]="profile?.image_profile || 'assets/images/default_profile.png'"
                    [alt]="profile?.first_name" />
                <span class="user-name hide-sm">{{ profile?.first_name }} {{ profile?.last_name }}</span>
                <i class="pi pi-angle-down hide-sm" style="font-size:.8rem;"></i>
            </button>

            <p-overlayPanel #userPanel styleClass="user-overlay-panel" [showTransitionOptions]="'150ms'"
                [hideTransitionOptions]="'100ms'">
                <ng-template pTemplate>
                    <div class="user-panel-header">
                        <img class="user-panel-avatar"
                            [src]="profile?.image_profile || 'assets/images/default_profile.png'"
                            [alt]="profile?.first_name" />
                        <div class="user-panel-info">
                            <div class="user-panel-name">{{ profile?.first_name }} {{ profile?.last_name }}</div>
                            <div class="user-panel-branch">สาขา: {{ branch_name }}</div>
                        </div>
                    </div>
                    <div class="user-panel-divider"></div>
                    <div class="user-panel-menu">
                        <button class="user-panel-item" (click)="openEditProfile(); userPanel.hide()">
                            <i class="pi pi-user"></i>
                            <span>แก้ไขข้อมูลส่วนตัว</span>
                        </button>
                        <button class="user-panel-item" (click)="openChangePass(); userPanel.hide()">
                            <i class="pi pi-key"></i>
                            <span>เปลี่ยนรหัสผ่าน</span>
                        </button>
                        <div class="user-panel-divider"></div>
                        <button class="user-panel-item danger" (click)="logout()">
                            <i class="pi pi-sign-out"></i>
                            <span>ออกจากระบบ</span>
                        </button>
                    </div>
                </ng-template>
            </p-overlayPanel>
        </div>
    </div>
</div>

<!-- ===== DIALOG: แก้ไขข้อมูลส่วนตัว ===== -->
<p-dialog header="แก้ไขข้อมูลส่วนตัว" [(visible)]="displayEditProfile" [modal]="true" showEffect="fade"
    [style]="{width: '360px'}" [breakpoints]="{'640px': '95vw'}">
    <form [formGroup]="formEdit">
        <div class="card p-fluid">
            <div class="grid">
                <div class="col-12 py-0 pb-4" style="text-align:center;">
                    <div class="profile-upload-area">
                        <img class="profile-img" [src]="formEdit.get('image_profile')!.value"
                            (click)="fileInput.click()" />
                        <div class="profile-upload-hint" (click)="fileInput.click()">
                            <i class="pi pi-camera"></i>
                        </div>
                    </div>
                    <input #fileInput type="file" (change)="onSelectImageProfile($event)" accept="image/*" hidden />
                </div>
                <div class="col-12 py-0">
                    <div class="field">
                        <label>ชื่อ</label>
                        <input pInputText type="text" formControlName="first_name" maxlength="200" />
                    </div>
                </div>
                <div class="col-12 py-0">
                    <div class="field">
                        <label>นามสกุล</label>
                        <input pInputText type="text" formControlName="last_name" maxlength="200" />
                    </div>
                </div>
                <div class="col-12 py-0">
                    <div class="field">
                        <label>เพศ</label>
                        <p-dropdown formControlName="gender" [options]="genders" optionLabel="name"
                            optionValue="value" placeholder="เลือกเพศ" appendTo="body"></p-dropdown>
                    </div>
                </div>
                <div class="col-12 py-0">
                    <div class="field">
                        <label>กลุ่มสิทธิ</label>
                        <input pInputText type="text" formControlName="member_group_name" readonly class="disabled" />
                    </div>
                </div>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton icon="pi pi-check" (click)="confirmEdit()" label="บันทึก"
            class="p-button-success mr-2"></button>
        <button pButton icon="pi pi-times" (click)="cancelEdit()" label="ยกเลิก"
            class="p-button-outlined p-button-danger"></button>
    </ng-template>
</p-dialog>

<!-- ===== DIALOG: เปลี่ยนรหัสผ่าน ===== -->
<p-dialog header="เปลี่ยนรหัสผ่าน" [(visible)]="displayChangePass" [modal]="true" showEffect="fade"
    [style]="{width: '360px'}" [breakpoints]="{'640px': '95vw'}">
    <form [formGroup]="formResetPass">
        <div class="card p-fluid">
            <div class="grid">
                <div class="col-12 py-0">
                    <div class="field">
                        <label>รหัสผ่านเดิม</label>
                        <input pInputText type="password" formControlName="old_password" maxlength="20" />
                    </div>
                </div>
                <div class="col-12 py-0">
                    <div class="field">
                        <label>รหัสผ่านใหม่</label>
                        <input pInputText type="password" formControlName="password" maxlength="20" />
                    </div>
                </div>
                <div class="col-12 py-0">
                    <div class="field">
                        <label>ยืนยันรหัสผ่านใหม่</label>
                        <input pInputText type="password" formControlName="confirm_password" maxlength="20" />
                    </div>
                </div>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton icon="pi pi-check" (click)="confirmChangePass()" label="บันทึก"
            class="p-button-success mr-2"></button>
        <button pButton icon="pi pi-times" (click)="cancelChangePass()" label="ยกเลิก"
            class="p-button-outlined p-button-danger"></button>
    </ng-template>
</p-dialog>

<p-toast position="top-right"></p-toast>
