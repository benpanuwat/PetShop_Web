<div class="ug-page">

    <!-- ===== LIST CARD ===== -->
    <div class="ug-list-card">
        <div class="ug-list-header">
            <div class="ug-list-title">
                <i class="pi pi-lock"></i>
                <span>กลุ่มสิทธิ</span>
            </div>
            <div class="ug-list-actions">
                <div class="p-inputgroup search-box">
                    <span class="p-inputgroup-addon"><i class="pi pi-search"></i></span>
                    <input pInputText type="text" [formControl]="search" placeholder="ค้นหา..." />
                    <button *ngIf="search.value" pButton type="button" icon="pi pi-times"
                        class="p-button-danger" (click)="search.reset()"></button>
                </div>
                <button *ngIf="permissions?.manag_user_group" (click)="openAdd()" pButton type="button"
                    icon="pi pi-plus" label="เพิ่มกลุ่มสิทธิ" class="p-button-success"></button>
            </div>
        </div>

        <p-table #dt [value]="data" [lazy]="true" (onLazyLoad)="loadTable($event)" dataKey="id"
            [paginator]="true" [loading]="loading" [rows]="10" [totalRecords]="totalRecords"
            styleClass="p-datatable-gridlines" [rowsPerPageOptions]="[10, 25, 50]">

            <ng-template pTemplate="header">
                <tr>
                    <th style="width:56px; text-align:center;">#</th>
                    <th>ชื่อกลุ่มสิทธิ</th>
                    <th *ngIf="permissions?.manag_user_group" style="width:100px; text-align:center;">จัดการ</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-item let-rowIndex="rowIndex">
                <tr>
                    <td class="text-center text-muted">{{ rowIndex + 1 }}</td>
                    <td>
                        <div class="group-cell">
                            <div class="group-icon"><i class="pi pi-shield"></i></div>
                            <span class="group-name">{{ item.name }}</span>
                        </div>
                    </td>
                    <td *ngIf="permissions?.manag_user_group" class="text-center">
                        <div class="action-btns">
                            <button pButton type="button" icon="pi pi-file-edit"
                                class="p-button-text p-button-sm p-button-secondary"
                                pTooltip="แก้ไข" (click)="openEdit(item.id)"></button>
                            <button pButton type="button" icon="pi pi-trash"
                                class="p-button-text p-button-sm p-button-danger"
                                pTooltip="ลบ" (click)="openDelete(item.id)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td [attr.colspan]="permissions?.manag_user_group ? 3 : 2" class="text-center"
                        style="padding:2.5rem; color:#94a3b8;">
                        <i class="pi pi-lock" style="font-size:1.5rem; display:block; margin-bottom:.5rem;"></i>
                        ยังไม่มีข้อมูลกลุ่มสิทธิ
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-toast position="bottom-center"></p-toast>

<!-- ===== SHARED: permission grid template ===== -->
<ng-template #permGrid let-form>
    <div [formGroup]="form">
        <div class="perm-grid-header">
            <span class="perm-col-menu">เมนู</span>
            <span class="perm-col-view">มองเห็น</span>
            <span class="perm-col-manag">จัดการ</span>
        </div>
        <div class="perm-rows">
            <div *ngFor="let item of permissionItems" class="perm-row">
                <span class="perm-label">{{ item.label }}</span>
                <div class="perm-col-view">
                    <p-checkbox *ngIf="item.hasView"
                        [formControlName]="'view_' + item.key"
                        binary="true" [trueValue]="1" [falseValue]="0"></p-checkbox>
                    <span *ngIf="!item.hasView" class="perm-na">—</span>
                </div>
                <div class="perm-col-manag">
                    <p-checkbox *ngIf="item.hasManag"
                        [formControlName]="'manag_' + item.key"
                        binary="true" [trueValue]="1" [falseValue]="0"></p-checkbox>
                    <span *ngIf="!item.hasManag" class="perm-na">—</span>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<!-- ===== DIALOG: เพิ่มกลุ่มสิทธิ ===== -->
<p-dialog header="เพิ่มกลุ่มสิทธิ" [(visible)]="displayAdd" [modal]="true" showEffect="fade"
    [style]="{width:'520px'}" [breakpoints]="{'640px':'95vw'}">
    <form [formGroup]="formAdd">
        <div class="dialog-form">
            <div class="field">
                <label>ชื่อกลุ่มสิทธิ <span class="required">*</span></label>
                <input pInputText type="text" formControlName="name" maxlength="200"
                    class="w-full" placeholder="เช่น ผู้ดูแลระบบ, พนักงานขาย" />
            </div>
            <div class="perm-section-label">
                <i class="pi pi-shield mr-1"></i>กำหนดสิทธิ์การเข้าถึง
            </div>
            <ng-container *ngTemplateOutlet="permGrid; context: { $implicit: formAdd }"></ng-container>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton type="button" icon="pi pi-check" (click)="confirmAdd()" label="บันทึก"
            class="p-button-success mr-2"></button>
        <button pButton type="button" icon="pi pi-times" (click)="cancelAdd()" label="ยกเลิก"
            class="p-button-outlined p-button-danger"></button>
    </ng-template>
</p-dialog>

<!-- ===== DIALOG: แก้ไขกลุ่มสิทธิ ===== -->
<p-dialog header="แก้ไขกลุ่มสิทธิ" [(visible)]="displayEdit" [modal]="true" showEffect="fade"
    [style]="{width:'520px'}" [breakpoints]="{'640px':'95vw'}">
    <form [formGroup]="formEdit">
        <div class="dialog-form">
            <div class="field">
                <label>ชื่อกลุ่มสิทธิ <span class="required">*</span></label>
                <input pInputText type="text" formControlName="name" maxlength="200" class="w-full" />
            </div>
            <div class="perm-section-label">
                <i class="pi pi-shield mr-1"></i>กำหนดสิทธิ์การเข้าถึง
            </div>
            <ng-container *ngTemplateOutlet="permGrid; context: { $implicit: formEdit }"></ng-container>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <button pButton type="button" icon="pi pi-check" (click)="confirmEdit()" label="บันทึก"
            class="p-button-success mr-2"></button>
        <button pButton type="button" icon="pi pi-times" (click)="cancelEdit()" label="ยกเลิก"
            class="p-button-outlined p-button-danger"></button>
    </ng-template>
</p-dialog>

<!-- ===== DIALOG: ลบ ===== -->
<p-dialog [(visible)]="displayDelete" [modal]="true" showEffect="fade"
    [style]="{width:'360px'}" [breakpoints]="{'640px':'95vw'}" [showHeader]="false">
    <div class="delete-confirm">
        <div class="delete-icon"><i class="pi pi-exclamation-triangle"></i></div>
        <div class="delete-title">ยืนยันการลบ</div>
        <div class="delete-msg">ต้องการลบกลุ่มสิทธินี้ใช่หรือไม่?<br>การกระทำนี้ไม่สามารถย้อนกลับได้</div>
        <div class="delete-actions">
            <button pButton type="button" icon="pi pi-trash" label="ลบ"
                class="p-button-danger" (click)="confirmDelete()"></button>
            <button pButton type="button" icon="pi pi-times" label="ยกเลิก"
                class="p-button-outlined p-button-secondary" (click)="cancelDelete()"></button>
        </div>
    </div>
</p-dialog>
